# Publishes static/ as the live demo (https://fcl-soc.github.io/exam-builder/) on every push to main.
# static/demo.js makes the page work without the Python server; nothing is saved in the demo.
name: Live demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - uses: actions/deploy-pages@v4
