<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark">
<title>Lesson plan</title>
<!--
  The lesson plan preview Claude shows in the chat (an "MCP App"). It shows the plan as it will paste into Compass
  and keeps itself up to date while Claude, or the teacher in Exam Assistant, changes it. Read-only: editing,
  Copy for Compass and Word are in Exam Assistant, one click away.

  The official MCP Apps client is embedded where MCP_APPS_CLIENT is (connector/vendor/), so nothing is fetched from
  the internet, which the school's web filter could block. The text formatting is static/plan-export.js, inserted
  where PLAN_EXPORT_JS is, so it can't drift from Compass.
-->
<style>
  :root { --bg: var(--color-background-primary, #fff); --fg: var(--color-text-primary, #1d2330);
          --muted: var(--color-text-secondary, #5b6475); --line: var(--color-border-secondary, #d5d9e0);
          --accent: #8B0000; font-family: var(--font-sans, system-ui, "Segoe UI", Arial, sans-serif); }
  body { margin: 0; padding: 10px 12px 12px; background: var(--bg); color: var(--fg); font-size: 14px; line-height: 1.5; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font-size: 16px; margin: 0; flex: 1; min-width: 12em; }
  .meta { color: var(--muted); font-size: 13px; width: 100%; margin-top: -6px; }
  button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  table { border-collapse: collapse; width: 100%; table-layout: fixed; }
  td { border: 1px solid var(--line); padding: 6px 9px; vertical-align: top; overflow-wrap: anywhere; }
  td.k { width: 26px; text-align: center; font-size: 18px; font-weight: 700; color: var(--accent); }
  td.n { width: 92px; font-weight: 700; font-size: 12px; color: var(--muted); }
  tr.changed td { animation: flash 2.5s ease-out; }
  tr.writing td { background: rgba(255, 214, 0, .18); }
  tr.writing td:last-child::after { content: "▍"; color: var(--accent); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes flash { from { background: rgba(255, 214, 0, .45); } to { background: transparent; } }
  .empty { color: var(--muted); font-style: italic; }
  .status { color: var(--muted); font-size: 12px; margin-top: 6px; }
</style></head>
<body>
<header><h1 id="title">Lesson plan</h1><button id="open" hidden>Open in Exam Assistant</button>
  <div class="meta" id="meta"></div></header>
<table><tbody id="rows"></tbody></table>
<div class="status" id="status">Waiting for the plan…</div>
<div class="status" id="fallback" hidden>To open it, copy this address into your browser: <b id="address"></b></div>
<script>
/*PLAN_EXPORT_JS*/
</script>
<script type="module">
/*MCP_APPS_CLIENT*/
</script>
<script type="module">
const { App } = window.McpApps;
const SECTIONS = [["L", "Learning Clarity"], ["E", "Explain"], ["A", "Application"], ["R", "Reflect"], ["N", "Next Steps"]];
const POLL_MS = 3000, POLL_FOR_MS = 20 * 60 * 1000;  // live for 20 minutes after the plan is shown
const $ = id => document.getElementById(id);
let planId = null, link = null, shown = null, pollUntil = 0;
let writing = false, base = null, baseAsked = false;  // while Claude writes: the saved plan the new text goes over

// ---------------------------------------------------------------- showing the plan
function render(plan, writingKey = null) {
  const changed = new Set(shown ? SECTIONS.map(([k]) => k).filter(k => shown.sections?.[k] !== plan.sections?.[k]) : []);
  shown = plan;
  $("title").textContent = plan.title || "Lesson plan";
  const when = /^\d{4}-\d{2}-\d{2}$/.test(plan.lesson_date || "") ? new Date(plan.lesson_date + "T00:00").toLocaleDateString(
    "en-AU", { weekday: "long", day: "numeric", month: "long", year: "numeric" }) : "";
  $("meta").textContent = [plan.subject, plan.year_level && `Year ${plan.year_level}`, when].filter(Boolean).join(" · ");
  $("rows").innerHTML = SECTIONS.map(([k, name]) => {
    const text = plan.sections?.[k] || "";
    const body = text.trim() ? compassHtml(sectionText(k, text)) : '<span class="empty">Not written yet</span>';
    const cls = k === writingKey ? "writing" : !writing && changed.has(k) ? "changed" : "";
    return `<tr data-k="${k}" class="${cls}"><td class="k">${k}</td><td class="n">${name}</td><td>${body}</td></tr>`;
  }).join("");
  // Compass draws fractions as equations; here they are written out as text (b/2), which is enough for a preview.
  for (const el of document.querySelectorAll(".my-math")) el.textContent = latexToUnicode(el.textContent.replace(/^\\\[|\\\]$/g, ""), false);
}

// The saved plan, from the tool's result or a refresh.
function show(result) {
  const plan = result?.plan;
  if (!plan || typeof plan !== "object") {
    if (result && result.ok === false) { writing = false; $("status").textContent = "Claude is still fixing this plan."; }
    return;
  }
  writing = false;
  if (result.plan_id) planId = result.plan_id;
  if (result.editor_link) { link = result.editor_link; $("open").hidden = false; $("address").textContent = link; }
  render(plan);
  $("status").textContent = "Saved. Updates by itself while Claude works. Edit, copy for Compass or download Word in Exam Assistant.";
  pollUntil = Date.now() + POLL_FOR_MS;
}

// Claude's text as it writes it, before it is saved: shown over the plan it is changing (or a blank one).
async function draft(args, complete = false) {
  if (!args || typeof args !== "object") return;
  writing = !complete;
  if (args.plan_id && !baseAsked) {  // changing a saved plan: show it, with the new sections arriving over it
    baseAsked = true;
    try {
      const r = await app.callServerTool({ name: "lesson_plan_preview", arguments: { plan_id: args.plan_id } });
      base = r?.structuredContent?.plan || null;
      if (r?.structuredContent?.editor_link) { link = r.structuredContent.editor_link; $("open").hidden = false; $("address").textContent = link; }
    } catch { /* the draft is shown on its own */ }
  }
  if (!writing && !complete) return;  // the result arrived while the saved plan was loading
  const details = args.details && typeof args.details === "object" ? args.details : {};
  const sections = args.sections && typeof args.sections === "object" ? args.sections : {};
  const plan = { ...(base || {}), ...details, sections: { ...(base?.sections || {}), ...sections } };
  plan.title = [plan.class_code, plan.topic].filter(Boolean).join(" · ") || "Lesson plan";
  const keys = Object.keys(sections);
  render(plan, complete ? null : keys[keys.length - 1]);
  $("status").textContent = complete ? "Saving…" : "Claude is writing this plan…";
}

// ---------------------------------------------------------------- talking to Claude (the official MCP Apps client)
const app = new App({ name: "Exam Assistant lesson plan", version: "1.2.0" });
app.ontoolinputpartial = ({ arguments: args }) => draft(args);
app.ontoolinput = ({ arguments: args }) => { if (writing || !shown) draft(args, true); };
app.ontoolresult = result => show(result.structuredContent);
app.ontoolcancelled = () => { writing = false; $("status").textContent = "Claude stopped before saving this plan."; };

async function poll() {
  if (planId && !writing && Date.now() < pollUntil && !document.hidden) {
    try {
      const r = await app.callServerTool({ name: "lesson_plan_preview", arguments: { plan_id: planId } });
      if (!writing && r?.structuredContent?.plan && JSON.stringify(r.structuredContent.plan) !== JSON.stringify(shown)) show(r.structuredContent);
    } catch { /* offline for a moment, or Claude didn't allow it: the last version stays on screen */ }
  }
  setTimeout(poll, POLL_MS);
}

// If Claude won't open the link, show the address so it can be copied into the browser.
$("open").onclick = async () => {
  if (!link) return;
  let refused = false;
  try { refused = (await app.openLink({ url: link }))?.isError; } catch { refused = true; }
  if (refused) $("fallback").hidden = false;
};

try {
  await app.connect();
  setTimeout(poll, POLL_MS);
} catch (e) {
  $("status").textContent = `The preview couldn't connect to Claude (${e.message}). Open the plan in Exam Assistant.`;
  $("fallback").hidden = false;
}
</script>
</body></html>
